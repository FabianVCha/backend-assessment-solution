name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: build and test (Java 21)
    runs-on: ubuntu-latest
    # The durable store is only proven against a real database, so the database is part of the job that
    # claims to prove it. The tests skip themselves when INTAKE_IT_JDBC_URL is absent; here it is set.
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_DB: intake
          POSTGRES_USER: intake
          POSTGRES_PASSWORD: local-demo-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intake -d intake"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Local behavioral, durability and schema regression coverage; not evidence of cloud SLOs.
      - run: mvn -B -ntp -f practical/pom.xml test
        env:
          INTAKE_IT_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/intake
          INTAKE_IT_DB_USER: intake
          INTAKE_IT_DB_PASSWORD: local-demo-only
      - name: test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: practical/target/surefire-reports
          if-no-files-found: ignore

  contracts:
    name: contracts are a valid document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Pinned: a lint run that changes with `latest` is not a gate. The JSON Schema is validated by
      # the Java suite, which is where the events that must satisfy it are produced.
      - run: npx --yes @redocly/cli@1.34.5 lint docs/api/webhooks.openapi.yaml

  infra:
    name: infrastructure compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No login: Bicep compilation is offline and requires no subscription.
      - run: az bicep install --version v0.49.2
      - run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          for environment in dev test prod; do
            az bicep build-params --file "infra/params/$environment.bicepparam" --stdout > /dev/null
          done

  security:
    name: secrets and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The repository is public: a leaked credential cannot be un-leaked by a later commit, so the
      # scan runs on the whole history, not only on the diff.
      - name: scan checked-out Git history for secrets
        run: |
          curl --fail --silent --show-error --location -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --config .github/workflows/gitleaks.toml --log-opts=--all .
      - name: build the local assessment demo image
        run: docker build -t premium-payment-intake:ci practical
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: premium-payment-intake:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  workflows:
    name: the workflows are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned release, no third-party action: a linter that runs from a moving tag is not a gate.
      - name: install actionlint
        run: |
          curl --fail --silent --show-error --location -o actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar xzf actionlint.tgz actionlint
          ./actionlint --version
      - name: lint workflows and deployment script
        run: |
          ./actionlint -color
          shellcheck .github/workflows/deploy-stage.sh
