name: cd

on:
  workflow_dispatch:
    inputs:
      release_digest:
        description: 'Approved production-runtime manifest digest (sha256:...) already in each stage ACR'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  dev:
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_RUNTIME_CD_ENABLED == 'true'
    uses: ./.github/workflows/cd-stage.yml
    with:
      stage: dev
      release_digest: ${{ inputs.release_digest }}

  test:
    needs: dev
    uses: ./.github/workflows/cd-stage.yml
    with:
      stage: test
      release_digest: ${{ inputs.release_digest }}

  prod:
    needs: test
    uses: ./.github/workflows/cd-stage.yml
    with:
      stage: prod
      release_digest: ${{ inputs.release_digest }}
